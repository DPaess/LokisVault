<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a6"/>
      <stop offset="1" stop-color="#b8893a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d4560"/>
      <stop offset="1" stop-color="#161a24"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#11131a"/>
  <!-- horns: thick at the temples, sweeping out then back up to thin tips -->
  <path d="M27 36 C15 34 6 26 6.5 5 C11 17 18 24 27.5 27 Z" fill="url(#gold)"/>
  <path d="M37 36 C49 34 58 26 57.5 5 C53 17 46 24 36.5 27 Z" fill="url(#gold)"/>
  <!-- tall, narrow helmet with a pointed crown -->
  <path d="M32 14 C37.5 18.5 41.5 27 41 37.5 C40.5 46.5 36.2 54 32 59 C27.8 54 23.5 46.5 23 37.5 C22.5 27 26.5 18.5 32 14 Z" fill="url(#metal)" stroke="url(#gold)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- center ridge and angled brow -->
  <path d="M32 17 L32 56" stroke="url(#gold)" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  <path d="M25 35.5 L32 31.5 L39 35.5" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- void gem -->
  <path d="M32 21 L34.8 25 L32 29 L29.2 25 Z" fill="#7fd3ff"/>
</svg>
